style: "style1 orient-right content-align-left image-position-left"
title : "Flowkeeper v1.1.0"
subtitle: |
  August 12, 2026
content : |
    <p>I am super happy to finally release v1.1! This version has a few noticeable features, and a bunch of small improvements under
    the hood. Major new features include fullscreen breaks and tasks categorization. The latter will also help me implement cool stuff
    like hiding backlogs or bi-directional sync with systems like Microsoft To Do.</p>
    <p>On the personal note, I must admit that this version has been in the works about six months longer than I expected. I could've
    shipped it much earlier if I asked AI to analyze and document popular task prioritization methods (see below), but I didn't.
    Instead I conducted my own research, tried <i>all</i> of the methods I found, discarded a few techniques, wrote and rewrote <i>my
    own</i> findings. I want to make it clear that I refuse using AI in my work and in my private life, and
    <a href="https://github.com/flowkeeper-org/fk-desktop/blob/rc-1.1.0/CONTRIBUTING.md">will reject</a> AI-generated submissions to
    Flowkeeper. </p>
    <p>Intelligence is not a tool, it is what makes us humans. Do not delegate yours to machine.</p>
    <p>Yours, Constantine.</p>
    <p>← <a href="/v1.0.2">What's new in v1.0.2</a></p>

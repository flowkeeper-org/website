features:
  a:
    style: "style1"
    title : "Fullscreen breaks"
    content: |
      <p>Fullscreen breaks are now implemented for all operating systems and enabled by default.</p>
      <p>They are only displayed on the primary screen, and can be dismissed by clicking or pressing any key. Furthermore,
      they can be disabled permanently in Settings > Series and breaks > Fullscreen breaks, or by clicking "Do not show this
      screen again" in the bottom-right corner.</p>
      <p>Fullscreen notifications are pretty intrusive. To prevent unwanted interruptions, I added a new taskbar notification,
      which by default fires one minute before the end of each pomodoro. It plays three knocks to remind you about approaching
      break. This is also configurable, including the audio.</p>
      <p>By the way, let me know if you'd like an option to disable easy dismissal (might help you enforce Pomodoro discipline).
      </p>
      <sup>GitHub Issues:
        <a href="https://github.com/flowkeeper-org/fk-desktop/issues/67">#67</a>
      </sup>
    image: "../images/releases/v1.1.0/fullscreen-break.png"
  b:
    style: "style1 orient-right"
    title : "Task categories"
    content: |
      <p>So far Flowkeeper helped you execute work that you chose. Now it also helps you <i>choose</i>.</p>
      <p>All you need to do is pick one of the popular prioritization methods from the list and drag your existing tasks
      between the groups. If you're unsure, just hover your mouse over a group name to get an explanation. When you create
      new work items, Flowkeeper asks you for a group first.</p>
      <p>A single task can be assigned to different categories. Categorization "survives" moving between backlogs and the
      "New Backlog from Incomplete" action. It is fully supported by export / import mechanism.</p>
      <p>Categorization can be an alternative to #tags.</p>
      <sup>GitHub Issues:
        <a href="https://github.com/flowkeeper-org/fk-desktop/issues/177">#177</a>
      </sup>
    image: "../images/releases/v1.1.0/group-description.png"
  c:
    style: "style1"
    title : "Standard categories"
    content: |
      <p>I tried most (all?) popular prioritization techniques and documented my findings in Flowkeeper. Press F5 or select
      "Manage Groups..." from the categorization dropdown menu to see the result.</p>
      <p>I encourage you to check out those methods, as they can take your individual productivity beyond Pomodoro Technique.
      At first they may look simple (even trivial!) but if you take it seriously, the effect can be surprisingly powerful.</p>
      <p>You can modify those groups and even delete them. Those modifications are stored in the data file, so they can be
      exported and imported on another machine, and will survive settings reset.</p>
      <p>The list could've been longer, but I discarded some of the systems, such as 3-3-3 Method, Pickle Jar Theory, MoSCoW
      Method and Warren Buffett's 5/25 Rule, as those were equivalent to the other ones, and I didn't want to waste time
      describing them...</p>
      <sup>GitHub Issues:
        <a href="https://github.com/flowkeeper-org/fk-desktop/issues/177">#177</a>
      </sup>
    image: "../images/releases/v1.1.0/predefined-groups.png"
  d:
    style: "style1 orient-right"
    title : "Custom categories"
    content: |
      <p>You can create new categories, reorder, rename and delete them using familiar Flowkeeper UI paradigm. Every work
      item can be assigned to different categories, which creates a multitude of use cases: Custom prioritization and "sizing"
      techniques; Grouping tasks by projects or learning subjects; Splitting work between professional and private, long-term
      and short-term, etc.</p>
      <p>If you delete a category, all associated work items automatically become uncategorized. If you rename or reorder
      categories, it doesn't affect the data. In other words, you can safely play with this, and you won't lose anything.</p>
      <p>You can even delete all standard categories and only leave your custom ones.</p>
      <sup>GitHub Issues:
        <a href="https://github.com/flowkeeper-org/fk-desktop/issues/177">#177</a>
      </sup>
    image: "../images/releases/v1.1.0/custom-groups.png"
  e:
    style: "style1"
    title : "Mute button"
    content: |
      <p>Mute button shows up in both "classic" and "minimal" focus modes while you are in a pomodoro. It allows you
      to mute timer ticking and rest music temporarily, for example if you need extra focus or if somebody called you.</p>
      <sup>GitHub Issues:
        <a href="https://github.com/flowkeeper-org/fk-desktop/issues/151">#151</a>
      </sup>
    image: "../images/releases/v1.1.0/mute.png"
  f:
    style: "style1 orient-right"
    title : "Undo task completion"
    content: |
      <p>Being able to undo task completion was one of the most popular requests, so here it comes. Select a completed task
      and press Ctrl+P again.</p>
      <sup>GitHub Issues:
        <a href="https://github.com/flowkeeper-org/fk-desktop/issues/55">#55</a>,
        <a href="https://github.com/flowkeeper-org/fk-desktop/issues/198">#198</a>
      </sup>
    image: "../images/releases/v1.1.0/undo-task-completion.png"
  g:
    style: "style1"
    title : "New themes and logo"
    content: |
      <p>This release includes a few cosmetic improvements, namely new Flowkeeper logo and a couple of new themes. The new
      icon conforms to <a href="https://develop.kde.org/hig/icons/colorful/">KDE icon guidelines</a>. The themes are
      grayscale, with colors closely matching Reddit light and Windows dark color schemes.</p>
      <sup>GitHub Issues:
        <a href="https://github.com/flowkeeper-org/fk-desktop/issues/53">#53</a>
      </sup>
    image: "../images/releases/v1.1.0/themes.png"
  h:
    style: "style1"
    title : "Miscellaneous"
    content: |
      <p>Minor and technical improvements</p>
      <ul>
        <li>Existing window is activated when another Flowkeeper instance is launched. Settings > General > Single
        Flowkeeper instance is enabled by default.</li>
        <li>"About > System info" tab to help reporting issues.</li>
        <li>Upgraded to the latest Qt 6.11.</li>
        <li>Fixed a bunch of code quality issues reported by SonarQube.</li>
        <li>Switched to Nuitka 4.x to compile the binaries.</li>
        <li>RPM builds and Fedora repos in <a href="https://build.opensuse.org/project/show/home:flowkeeper">OBS</a>.</li>
        <li>Converted all audio resources to m4a format to reduce the number of bugreports associated with audio.</li>
        <li>Metadata on workitems and backlogs (huge enabler for future features!)</li>
        <li>New build configurations: Ubuntu 26.04, macOS 26 and Windows 11 ARM.</li>
        <li>Snapcraft.io manifest.</li>
      </ul>
      <p>Bug fixes</p>
      <ul>
        <li>An issue when launching Flowkeeper during a long break.</li>
        <li>Two bugs with import/export handling of reordering.</li>
        <li>Drag-and-drop in Wayland.</li>
      </ul>
      <sup>GitHub Issues:
        <a href="https://github.com/flowkeeper-org/fk-desktop/issues/89">#89</a>,
        <a href="https://github.com/flowkeeper-org/fk-desktop/issues/112">#112</a>,
        <a href="https://github.com/flowkeeper-org/fk-desktop/issues/127">#127</a>,
        <a href="https://github.com/flowkeeper-org/fk-desktop/issues/223">#223</a>
      </sup>
